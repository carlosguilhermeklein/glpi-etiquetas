name: Release

# Runs when a release is published on GitHub (the tag must equal the version in setup.php)
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build plugin archive
        run: sh tools/release.sh

      - name: Attach archive to the release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/glpi-etiquetas-*.tar.bz2
